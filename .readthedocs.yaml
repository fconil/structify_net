version: 2

sphinx:
   configuration: docs/source/conf.py

build:
   os: ubuntu-24.04
   tools:
      python: "3.12"
   jobs:
      pre_create_environment:
         - asdf plugin add uv
         - asdf install uv latest
         - asdf global uv latest
      create_environment:
         - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
      install:
         # --frozen : when uv.lock is present, this will ensure that the environment 
         # is created with the exact versions specified in uv.lock
         - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --group dev
